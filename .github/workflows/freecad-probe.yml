# SPDX-License-Identifier: AGPL-3.0-only
# A small, targeted FreeCAD run for diagnosing one thing: only on pushes to
# the freecad-probe branch. It runs scripts/probe/probe.py and the Agent Link
# tests named in scripts/probe/tests (one unittest id per line) against the
# FreeCAD series in scripts/probe/series, with the add-on at
# scripts/probe/addon-ref. A few minutes instead of the full bake-off.
name: FreeCAD probe

on:
  push:
    branches: [freecad-probe]

permissions:
  contents: read

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - id: cfg
        run: |
          echo "ref=$(cat scripts/probe/addon-ref 2>/dev/null || echo agent-link)" >> "$GITHUB_OUTPUT"
          echo "series=$(cat scripts/probe/series 2>/dev/null || echo 1.1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: jamesK1000011/FreeCAD
          ref: ${{ steps.cfg.outputs.ref }}
          path: freecad-addon
          sparse-checkout: src/Mod/AgentLink
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fc${{ steps.cfg.outputs.series }}
          create-args: >-
            -c conda-forge
            freecad=${{ steps.cfg.outputs.series }}
            python=3.11
            calculix
            gmsh
            numpy
          cache-environment: true
      - name: OrcaSlicer
        # The latest release's Linux AppImage, unpacked, as the bake-off has it.
        timeout-minutes: 6
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(gh api repos/OrcaSlicer/OrcaSlicer/releases/latest -q '[.assets[].name | select(endswith(".AppImage"))] | map(select(test("aarch64") | not)) | (map(select(test("2404"))) + .)[0]')
          echo "asset: $name"
          gh release download --repo OrcaSlicer/OrcaSlicer --pattern "$name" --dir "$RUNNER_TEMP/orca"
          cd "$RUNNER_TEMP/orca" && chmod +x "$name" && "./$name" --appimage-extract > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb libopengl0 libegl1 libgl1 libwebkit2gtk-4.1-0 libgstreamer-plugins-base1.0-0 > /dev/null || true
          echo "AGENTLINK_ORCASLICER=$RUNNER_TEMP/orca/squashfs-root/AppRun" >> "$GITHUB_ENV"
          echo "AGENTLINK_ORCA_PRESETS=$RUNNER_TEMP/orca/squashfs-root/resources/profiles" >> "$GITHUB_ENV"
      - name: Orca samples
        # scripts/probe/orca.sh, when there: the Orca command line's own
        # projects and answers, kept as an artifact to read.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/orca-out"
          [ -f scripts/probe/orca.sh ] && timeout 540 bash scripts/probe/orca.sh "$RUNNER_TEMP/orca-out" || echo "no orca.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orca-out
          path: ${{ runner.temp }}/orca-out
          if-no-files-found: ignore
          retention-days: 3
      - name: Probe
        run: |
          export FREECAD_LIB=$CONDA_PREFIX/lib
          export PYTHONPATH=$GITHUB_WORKSPACE/freecad-addon/src/Mod/AgentLink:$GITHUB_WORKSPACE/freecad/ScanRulerFC
          [ -f scripts/probe/probe.py ] && timeout 600 python scripts/probe/probe.py || echo "probe exit $?"
      - name: Named tests
        run: |
          export FREECAD_LIB=$CONDA_PREFIX/lib
          export PYTHONPATH=$GITHUB_WORKSPACE/freecad-addon/src/Mod/AgentLink:$GITHUB_WORKSPACE/freecad/ScanRulerFC
          cd freecad-addon/src/Mod/AgentLink/tests
          ids=$(grep -v '^#' $GITHUB_WORKSPACE/scripts/probe/tests 2>/dev/null | xargs)
          [ -n "$ids" ] && timeout 900 xvfb-run -a python -X faulthandler -m unittest -v $ids || true
