# SPDX-License-Identifier: AGPL-3.0-only
# The FreeCAD spike and the bake-off, on GitHub's machines: FreeCAD from
# conda-forge runs the Agent Link add-on (from the FreeCAD fork,
# jamesK1000011/FreeCAD, branch agent-link) headless (its tests, then the
# brief); ScanRuler builds and runs the same brief in headless Chrome; its
# Deviation workspace compares the two bins; the scorecard goes to the run's
# summary page. Nothing here needs the Mac.
name: FreeCAD bake-off

# Kept small on purpose (GitHub's minutes are free, not ours to waste): a
# push runs only when it touches the FreeCAD port, these scripts or this
# file. The add-on lives in the other fork, so a run for an Agent Link
# change is asked for by pinning its commit in scripts/bakeoff/addon-ref.
# The browser bake-off (the scanruler job) runs only on request: "[bakeoff]"
# in the commit message, or Run workflow.
on:
  push:
    branches: [freecad-spike, 'freecad-spike-*']
    paths:
      - 'freecad/**'
      - 'scripts/freecad/**'
      - 'scripts/bakeoff/**'
      - '.github/workflows/freecad-bakeoff.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bakeoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freecad:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      # Which branch of the fork to test: scripts/bakeoff/addon-ref, so a
      # branch here (freecad-spike-<family>) can test that family's branch.
      - name: The add-on's branch
        id: ref
        run: echo "ref=$(cat scripts/bakeoff/addon-ref 2>/dev/null || echo agent-link)" >> "$GITHUB_OUTPUT"
      - name: The add-on, from the FreeCAD fork
        uses: actions/checkout@v5
        with:
          repository: jamesK1000011/FreeCAD
          ref: ${{ steps.ref.outputs.ref }}
          path: freecad-addon
          sparse-checkout: src/Mod/AgentLink
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fc
          create-args: >-
            -c conda-forge
            freecad
            python=3.11
            calculix
            gmsh
            numpy
          cache-environment: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: FreeCAD imports
        run: |
          echo "FREECAD_LIB=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
          # Both add-ons importable, as in FreeCAD's Mod folder: Agent Link
          # from the fork, ScanRuler for FreeCAD from this repo.
          echo "AGENTLINK_RENDERS=$GITHUB_WORKSPACE/bakeoff-out/freecad/renders" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/freecad-addon/src/Mod/AgentLink:$GITHUB_WORKSPACE/freecad/ScanRulerFC" >> "$GITHUB_ENV"
          export FREECAD_LIB=$CONDA_PREFIX/lib
          python -c "import sys; sys.path.append('$CONDA_PREFIX/lib'); import FreeCAD, Part, MeshPart; print('FreeCAD', FreeCAD.Version()[:3])"
      - name: PrusaSlicer, for the slice tool
        # The apt mirror sometimes hangs: the slice tests skip without it.
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends prusa-slicer xvfb > /dev/null && (prusa-slicer --help | head -1 || true)
      - name: OrcaSlicer, for the slice tool
        # The latest release's Linux AppImage, unpacked (no FUSE on the
        # runner); the Orca slice tests skip without it.
        timeout-minutes: 6
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(gh api repos/OrcaSlicer/OrcaSlicer/releases/latest -q '[.assets[].name | select(endswith(".AppImage"))] | (map(select(test("2404"))) + .)[0]')
          echo "asset: $name"
          gh release download --repo OrcaSlicer/OrcaSlicer --pattern "$name" --dir "$RUNNER_TEMP/orca"
          cd "$RUNNER_TEMP/orca" && chmod +x "$name" && "./$name" --appimage-extract > /dev/null
          sudo apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-0 libgstreamer-plugins-base1.0-0 > /dev/null || true
          echo "AGENTLINK_ORCASLICER=$RUNNER_TEMP/orca/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: The Studio themes, pictured
        # A GUI under a virtual screen: worth a look, never a failure.
        continue-on-error: true
        timeout-minutes: 10
        run: bash scripts/freecad/theme-shots.sh freecad-addon/src/Mod/AgentLink "$AGENTLINK_RENDERS/theme"
      - name: Agent Link tests
        # a hung test stops here, not at the job's 40 minutes
        timeout-minutes: 15
        run: python -m unittest discover -s freecad-addon/src/Mod/AgentLink/tests -v
      - name: ScanRuler for FreeCAD tests
        run: python -m unittest discover -s freecad/ScanRulerFC/tests -v
      - name: The Claude extension's launcher, against a fake FreeCAD
        run: node scripts/freecad/mcpb/test/launcher.test.mjs
      - name: The pictures, in the log
        if: always()
        # The artifact store is out of reach from where the pictures are
        # looked at; the log is not. Each file as base64 between markers.
        run: |
          python - <<'PY'
          import base64, glob, os
          root = os.environ.get("AGENTLINK_RENDERS", "")
          for p in sorted(glob.glob(os.path.join(root, "**", "*.png"), recursive=True) + glob.glob(os.path.join(root, "drawing", "*.svg"))):
              with open(p, "rb") as f:
                  data = base64.b64encode(f.read()).decode()
              print(f"=== RENDER {os.path.relpath(p, root)} {len(data)}")
              for i in range(0, len(data), 4000):
                  print(data[i:i + 4000])
              print("=== END")
          PY
      - name: The brief, headless
        run: node scripts/bakeoff/run-freecad.mjs --out bakeoff-out/freecad --python python
      - name: Server log
        if: always()
        run: tail -n 80 bakeoff-out/freecad/server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freecad-side
          path: bakeoff-out/freecad/
          if-no-files-found: warn

  # The FreeCAD the person runs on the Mac is 1.0.2: the tests on the newest
  # 1.0 conda-forge has (it skips some point releases)
  # as well as on the newest.
  freecad-1-0:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - name: The add-on's branch
        id: ref
        run: echo "ref=$(cat scripts/bakeoff/addon-ref 2>/dev/null || echo agent-link)" >> "$GITHUB_OUTPUT"
      - name: The add-on, from the FreeCAD fork
        uses: actions/checkout@v5
        with:
          repository: jamesK1000011/FreeCAD
          ref: ${{ steps.ref.outputs.ref }}
          path: freecad-addon
          sparse-checkout: src/Mod/AgentLink
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fc10
          create-args: >-
            -c conda-forge
            freecad>=1.0,<1.1
            python=3.11
            calculix
            gmsh
            numpy
          cache-environment: true
      - name: FreeCAD imports
        run: |
          echo "FREECAD_LIB=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/freecad-addon/src/Mod/AgentLink:$GITHUB_WORKSPACE/freecad/ScanRulerFC" >> "$GITHUB_ENV"
          python -c "import sys; sys.path.append('$CONDA_PREFIX/lib'); import FreeCAD; print('FreeCAD', FreeCAD.Version()[:3])"
      - name: Agent Link tests
        # a hung test stops here, not at the job's 40 minutes
        timeout-minutes: 15
        run: python -m unittest discover -s freecad-addon/src/Mod/AgentLink/tests
      - name: ScanRuler for FreeCAD tests
        run: python -m unittest discover -s freecad/ScanRulerFC/tests

  scanruler:
    needs: freecad
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bakeoff]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix mcp ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: freecad-side
          path: bakeoff-out/freecad
      - name: The brief and the deviation, in headless Chrome
        env:
          APP_URL: http://localhost:4173/
          CHROME: /usr/bin/google-chrome
          OUT_DIR: ${{ github.workspace }}/bakeoff-out/scanruler
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node scripts/bakeoff/run-scanruler.mjs --out bakeoff-out/scanruler --freecad bakeoff-out/freecad
      - name: Scorecard
        if: always()
        run: node scripts/bakeoff/score.mjs --out bakeoff-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bakeoff
          path: bakeoff-out/
          if-no-files-found: warn
